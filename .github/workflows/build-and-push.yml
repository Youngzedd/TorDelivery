name: Build, test and push image

# Builds the Dockerfile, smoke-tests the resulting container, then pushes
# it to GitHub Container Registry as ghcr.io/youngzedd/tordelivery:latest
# (plus a tag for the commit SHA). Dokploy is configured separately to
# pull that image and deploy it — this workflow does not deploy anything
# itself, it only produces the image Dokploy fetches.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-push
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tordelivery

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally for testing, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tordelivery:test

      - name: Smoke test — container starts and serves the homepage
        run: |
          set -eu
          docker run -d --name tordelivery-smoke -p 8080:80 tordelivery:test

          # Give Apache/PHP a moment to come up, then poll instead of a
          # fixed sleep so this doesn't flake on a slower runner.
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null "http://localhost:8080/"; then
              echo "Homepage responded OK"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "Homepage never responded, dumping container logs:"
              docker logs tordelivery-smoke
              exit 1
            fi
            sleep 1
          done

          # A couple of other pages that must exist, plus confirm PHP is
          # actually executing submit-report.php rather than being served
          # as flat text (a GET should hit its own 405 JSON response).
          status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/contact.html")
          [ "$status" = "200" ] || { echo "contact.html returned $status"; exit 1; }

          php_status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/submit-report.php")
          [ "$php_status" = "405" ] || { echo "submit-report.php returned $php_status, expected 405 (PHP not executing?)"; exit 1; }

      - name: Tear down smoke test container
        if: always()
        run: docker rm -f tordelivery-smoke || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
